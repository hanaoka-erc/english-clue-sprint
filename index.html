<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Clue Sprint</title><style>
:root{--bg:#0f1220;--panel:#171b2e;--panel2:#202640;--text:#f5f7ff;--muted:#aab2d5;--accent:#7aa2ff;--good:#49d17d;--bad:#ff6b7a;--border:#2e3558}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0d1020,#12162a);color:var(--text);min-height:100vh}.wrap{max-width:820px;margin:auto;padding:28px 18px 56px}.card{background:rgba(23,27,46,.97);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 16px 40px rgba(0,0,0,.25)}h1{margin:0 0 6px;font-size:30px}h2{margin:0 0 14px}p{line-height:1.7}.muted{color:var(--muted)}.toprow{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:20px}.badge{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:14px}.progress{height:8px;background:#252b48;border-radius:999px;overflow:hidden;margin:14px 0 4px}.bar{height:100%;background:var(--accent);width:0;transition:width .2s}.clue{font-size:28px;line-height:1.35;font-weight:750;padding:28px 10px 22px;text-align:center}.phasehint{text-align:center;color:var(--muted);font-size:13px;margin-top:4px}.reveal{width:100%;margin-top:14px;padding:18px;border-radius:14px;background:#252d4c;color:var(--text);border:1px solid var(--border);font-weight:750}.options{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}button{appearance:none;border:none;cursor:pointer;font:inherit}.option{text-align:left;padding:16px 18px;border-radius:14px;background:#222946;color:var(--text);border:1px solid #30395f;min-height:58px}.option.correct{background:rgba(73,209,125,.17);border-color:var(--good)}.option.wrong{background:rgba(255,107,122,.16);border-color:var(--bad)}.option:disabled{cursor:default;opacity:.95}.primary{background:var(--accent);color:#09102a;font-weight:800;padding:13px 18px;border-radius:12px}.secondary{background:#252d4c;color:var(--text);border:1px solid var(--border);padding:12px 16px;border-radius:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.resultgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}.stat strong{display:block;font-size:28px}.review{margin-top:20px;display:grid;gap:12px}.reviewitem{background:#202640;border:1px solid var(--border);border-radius:14px;padding:14px 16px}.reviewitem .en{font-weight:800;margin-bottom:6px}.ok{color:var(--good)}.ng{color:var(--bad)}.small{font-size:13px}.hidden{display:none!important}footer{color:var(--muted);font-size:12px;margin-top:16px;text-align:center}@media(max-width:620px){.clue{font-size:23px}.resultgrid{grid-template-columns:1fr}.card{padding:18px}}
</style></head><body><main class="wrap">
<section id="startScreen" class="card"><h1>English Clue Sprint</h1><p class="muted">英語の論理パズル表現を瞬時に意味へ変換する10問スプリント。</p><div class="actions"><button class="primary" id="startBtn">10問スタート</button></div><p class="small muted">まず英文だけを読み、理解したらタップ。英文は消え、その後4択から意味を選びます。</p></section>
<section id="quizScreen" class="card hidden"><div class="toprow"><div><span class="badge" id="qNum"></span> <span class="badge" id="category"></span></div><span class="badge" id="timer">0.0 s</span></div><div class="progress"><div id="bar" class="bar"></div></div><div class="clue" id="clue"></div><div class="phasehint" id="phaseHint">英文の意味を理解したらタップ</div><button class="reveal" id="revealBtn">意味を理解した → 選択肢を表示</button><div class="options hidden" id="options"></div></section>
<section id="resultScreen" class="card hidden"><h2>Result</h2><div class="resultgrid"><div class="stat"><span class="muted">Score</span><strong id="score"></strong></div><div class="stat"><span class="muted">Total</span><strong id="totalTime"></strong></div><div class="stat"><span class="muted">Avg reading</span><strong id="avgReading"></strong></div><div class="stat"><span class="muted">Avg answer</span><strong id="avgAnswer"></strong></div></div><div class="actions"><button class="primary" id="retryBtn">もう一度</button><button class="secondary" id="copyBtn">結果をコピー</button></div><div class="review" id="review"></div></section><footer>English Clue Sprint v1.3 — 92 reviewed clues</footer></main>
<script src="questions.js"></script><script src="questions_batch2.js"></script><script>
const $=id=>document.getElementById(id),startScreen=$('startScreen'),quizScreen=$('quizScreen'),resultScreen=$('resultScreen'),clueEl=$('clue'),optionsEl=$('options'),qNumEl=$('qNum'),catEl=$('category'),timerEl=$('timer'),barEl=$('bar'),revealBtn=$('revealBtn'),phaseHint=$('phaseHint');let questions=[],index=0,score=0,startedAt=0,questionStartedAt=0,choicesShownAt=0,currentReadingTime=0,raf=null,results=[],locked=false,thinkingTotal=0;function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function startGame(){questions=shuffle(BANK).slice(0,10);index=score=0;results=[];thinkingTotal=0;startedAt=performance.now();startScreen.classList.add('hidden');resultScreen.classList.add('hidden');quizScreen.classList.remove('hidden');renderQuestion();updateTimer()}function updateTimer(){timerEl.textContent=((performance.now()-startedAt)/1000).toFixed(1)+' s';raf=requestAnimationFrame(updateTimer)}function renderQuestion(){locked=false;questionStartedAt=performance.now();choicesShownAt=0;currentReadingTime=0;let item=questions[index];qNumEl.textContent=`Q${index+1} / 10`;catEl.textContent=item.cat;barEl.style.width=`${index*10}%`;clueEl.classList.remove('hidden');clueEl.textContent=item.q;phaseHint.textContent='英文の意味を理解したらタップ';revealBtn.classList.remove('hidden');optionsEl.classList.add('hidden');optionsEl.innerHTML='';shuffle([item.a,...item.w]).forEach(text=>{let b=document.createElement('button');b.className='option';b.textContent=text;b.onclick=()=>answer(b,text,item);optionsEl.appendChild(b)})}function revealOptions(){if(locked||choicesShownAt)return;choicesShownAt=performance.now();currentReadingTime=(choicesShownAt-questionStartedAt)/1000;clueEl.classList.add('hidden');revealBtn.classList.add('hidden');phaseHint.textContent='正しい意味を選択';optionsEl.classList.remove('hidden')}function answer(btn,selected,item){if(locked||!choicesShownAt)return;locked=true;let answerTime=(performance.now()-choicesShownAt)/1000,correct=selected===item.a;if(correct)score++;thinkingTotal+=currentReadingTime+answerTime;[...optionsEl.children].forEach(b=>{b.disabled=true;if(b.textContent===item.a)b.classList.add('correct')});if(!correct)btn.classList.add('wrong');results.push({q:item.q,cat:item.cat,correctAnswer:item.a,correct,readingTime:currentReadingTime,answerTime});setTimeout(()=>{index++;index<10?renderQuestion():finishGame()},correct?300:650)}function finishGame(){cancelAnimationFrame(raf);quizScreen.classList.add('hidden');resultScreen.classList.remove('hidden');barEl.style.width='100%';let ar=results.reduce((s,r)=>s+r.readingTime,0)/results.length,aa=results.reduce((s,r)=>s+r.answerTime,0)/results.length;$('score').textContent=`${score} / 10`;$('totalTime').textContent=`${thinkingTotal.toFixed(1)} s`;$('avgReading').textContent=`${ar.toFixed(1)} s`;$('avgAnswer').textContent=`${aa.toFixed(1)} s`;let review=$('review');review.innerHTML='';results.forEach((r,i)=>{let d=document.createElement('div');d.className='reviewitem';d.innerHTML=`<div class="small muted">${i+1}. ${esc(r.cat)} — Read ${r.readingTime.toFixed(1)}s / Answer ${r.answerTime.toFixed(1)}s</div><div class="en">${esc(r.q)}</div><div class="${r.correct?'ok':'ng'}">${r.correct?'✓ 正解':'✗ 不正解'}</div>${r.correct?'':`<div class="small muted">正解：${esc(r.correctAnswer)}</div>`}`;review.appendChild(d)})}function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function copyResult(){let ar=results.reduce((s,r)=>s+r.readingTime,0)/results.length,aa=results.reduce((s,r)=>s+r.answerTime,0)/results.length,text=`English Clue Sprint\nScore: ${score}/10\nThinking time: ${thinkingTotal.toFixed(1)}s\nAvg reading: ${ar.toFixed(1)}s\nAvg answer: ${aa.toFixed(1)}s`;try{await navigator.clipboard.writeText(text)}catch{alert(text)}}$('startBtn').onclick=startGame;revealBtn.onclick=revealOptions;$('retryBtn').onclick=startGame;$('copyBtn').onclick=copyResult;
</script></body></html>
