<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>English Clue Sprint</title>
<style>
:root{--bg:#0f1220;--panel:#171b2e;--panel2:#202640;--text:#f5f7ff;--muted:#aab2d5;--accent:#7aa2ff;--good:#49d17d;--bad:#ff6b7a;--border:#2e3558}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#0d1020,#12162a);color:var(--text);min-height:100vh}.wrap{max-width:820px;margin:0 auto;padding:28px 18px 56px}.card{background:rgba(23,27,46,.97);border:1px solid var(--border);border-radius:20px;padding:24px;box-shadow:0 16px 40px rgba(0,0,0,.25)}h1{margin:0 0 6px;font-size:30px}h2{margin:0 0 14px}p{line-height:1.7}.muted{color:var(--muted)}.toprow{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:20px}.badge{background:var(--panel2);border:1px solid var(--border);color:var(--muted);padding:8px 12px;border-radius:999px;font-size:14px}.progress{height:8px;background:#252b48;border-radius:999px;overflow:hidden;margin:14px 0 16px}.bar{height:100%;background:var(--accent);width:0%;transition:width .2s ease}.cluecard{display:block;width:100%;border:1px solid #30395f;border-radius:18px;background:#1d233b;color:var(--text);padding:26px 18px 20px;cursor:pointer;transition:.12s ease}.cluecard:hover{background:#222946;transform:translateY(-1px)}.cluecard.revealed{cursor:default;background:#1d233b;transform:none}.clue{font-size:28px;line-height:1.35;font-weight:750;text-align:center}.phasehint{text-align:center;color:var(--muted);font-size:13px;margin-top:14px}.options{display:grid;grid-template-columns:1fr;gap:12px;margin-top:16px}.option{text-align:left;padding:16px 18px;border-radius:14px;background:#222946;color:var(--text);border:1px solid #30395f;transition:.12s ease;min-height:58px}.option:hover{transform:translateY(-1px);background:#283052}.option.correct{background:rgba(73,209,125,.17);border-color:var(--good)}.option.wrong{background:rgba(255,107,122,.16);border-color:var(--bad)}.option:disabled{cursor:default;opacity:.95;transform:none}button{appearance:none;border:none;cursor:pointer;font:inherit}.primary{background:var(--accent);color:#09102a;font-weight:800;padding:13px 18px;border-radius:12px}.secondary{background:#252d4c;color:var(--text);border:1px solid var(--border);padding:12px 16px;border-radius:12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.resultgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}.stat strong{display:block;font-size:28px}.review{margin-top:20px;display:grid;gap:12px}.reviewitem{background:#202640;border:1px solid var(--border);border-radius:14px;padding:14px 16px}.reviewitem .en{font-weight:800;margin-bottom:6px}.ok{color:var(--good)}.ng{color:var(--bad)}.small{font-size:13px}.hidden{display:none!important}footer{color:var(--muted);font-size:12px;margin-top:16px;text-align:center}@media(max-width:620px){.clue{font-size:23px}.resultgrid{grid-template-columns:1fr 1fr}.card{padding:18px}}
</style>
</head>
<body><main class="wrap">
<section id="startScreen" class="card"><h1>English Clue Sprint</h1><p class="muted">英語の論理パズル表現を、和訳を経由しすぎず瞬時に意味へ変換するための10問スプリント。</p><div class="actions"><button class="primary" id="startBtn">10問スタート</button></div><p class="small muted">まず英文だけを表示します。意味を理解したら英文カードをタップすると4択が出ます。Reading time と Answer time を別々に計測します。</p></section>
<section id="quizScreen" class="card hidden"><div class="toprow"><div><span class="badge" id="qNum">Q1 / 10</span> <span class="badge" id="category">Ordering</span></div><span class="badge" id="timer">0.0 s</span></div><div class="progress"><div id="bar" class="bar"></div></div><button id="clueCard" class="cluecard"><div class="clue" id="clue"></div><div class="phasehint" id="phaseHint">意味を理解したらタップ</div></button><div class="options hidden" id="options"></div></section>
<section id="resultScreen" class="card hidden"><h2>Result</h2><div class="resultgrid"><div class="stat"><span class="muted">Score</span><strong id="score"></strong></div><div class="stat"><span class="muted">Total</span><strong id="totalTime"></strong></div><div class="stat"><span class="muted">Avg reading</span><strong id="avgReading"></strong></div><div class="stat"><span class="muted">Avg answer</span><strong id="avgAnswer"></strong></div></div><div class="actions"><button class="primary" id="retryBtn">もう一度</button><button class="secondary" id="copyBtn">結果をコピー</button></div><div class="review" id="review"></div></section>
<footer>English Clue Sprint v1.1 — ER CHAMP practice</footer></main>
<script>
const BANK=[
{cat:"Ordering / Ranking",q:"Alice finished before Bob.",a:"アリスはボブより早く終えた。",w:["アリスはボブより遅く終えた。","アリスとボブは同時に終えた。","アリスはボブの直後に終えた。"]},
{cat:"Ordering / Ranking",q:"Claire finished immediately after David.",a:"クレアはデイビッドの直後に終えた。",w:["クレアはデイビッドより前ならどこでもよい。","クレアとデイビッドの間には1人いる。","クレアはデイビッドより2つ後ろである。"]},
{cat:"Ordering / Ranking",q:"Ethan finished no earlier than Fiona.",a:"イーサンはフィオナより早くは終えていない。つまり同時または後である。",w:["イーサンは必ずフィオナより早い。","イーサンはフィオナの直前である。","イーサンとフィオナの間には誰もいない。"]},
{cat:"Ordering / Ranking",q:"Grace finished no later than Henry.",a:"グレースはヘンリーより遅くはない。つまり同時または前である。",w:["グレースは必ずヘンリーより遅い。","グレースはヘンリーの2つ後ろである。","グレースとヘンリーは隣り合わない。"]},
{cat:"Ordering / Ranking",q:"Ivy finished two places ahead of Jack.",a:"アイビーはジャックより2つ前の順位である。",w:["アイビーとジャックの間に2人いる。","アイビーはジャックの直前である。","ジャックはアイビーより2つ前である。"]},
{cat:"Ordering / Ranking",q:"There are exactly two people between Kate and Liam.",a:"ケイトとリアムの間にはちょうど2人いる。",w:["ケイトとリアムの順位差は2である。","ケイトはリアムより2つ前である。","ケイトとリアムは隣り合う。"]},
{cat:"Position / Arrangement",q:"Maya sits immediately to the left of Noah.",a:"マヤはノアのすぐ左に座っている。",w:["マヤはノアの左側ならどこでもよい。","マヤはノアのすぐ右に座っている。","マヤとノアの間には1人いる。"]},
{cat:"Position / Arrangement",q:"Olivia sits somewhere to the right of Peter.",a:"オリビアはピーターより右側のどこかに座っている。隣とは限らない。",w:["オリビアはピーターのすぐ右である。","オリビアはピーターより左にいる。","オリビアとピーターは必ず端にいる。"]},
{cat:"Position / Arrangement",q:"Quinn sits at either end of the row.",a:"クインは列のどちらか一方の端に座る。",w:["クインは列の中央に座る。","クインは左端に限る。","クインは右端に限る。"]},
{cat:"Position / Arrangement",q:"Rachel does not sit next to Sam.",a:"レイチェルとサムは隣り合わない。",w:["レイチェルはサムの左隣である。","レイチェルはサムの右隣である。","レイチェルとサムの間には必ず1人だけいる。"]},
{cat:"Position / Arrangement",q:"Tina sits between Uma and Victor.",a:"ティナはウマとビクターの間に座っている。",w:["ティナはウマとビクターの両方より左にいる。","ティナはウマかビクターのどちらかと隣り合うだけでよい。","ティナは列の端に座る。"]},
{cat:"Position / Arrangement",q:"Wendy sits two seats to the right of Xavier.",a:"ウェンディはゼイビアより2席右に座る。",w:["ウェンディとゼイビアの間に2人いる。","ウェンディはゼイビアの右隣である。","ウェンディはゼイビアより2席左に座る。"]},
{cat:"Scheduling",q:"The meeting takes place before lunch.",a:"会議は昼食より前に行われる。",w:["会議は昼食の直後に行われる。","会議は昼食中に行われる。","会議は昼食より後に行われる。"]},
{cat:"Scheduling",q:"The interview is scheduled immediately after the presentation.",a:"面接はプレゼンテーションの直後に予定されている。",w:["面接はプレゼンテーションより前ならいつでもよい。","面接とプレゼンの間に1枠ある。","面接はプレゼンと同時である。"]},
{cat:"Scheduling",q:"The workshop cannot be held on Monday or Friday.",a:"ワークショップは月曜にも金曜にも開催できない。",w:["ワークショップは月曜か金曜のどちらかに必ず行う。","ワークショップは月曜と金曜の両方に行う。","ワークショップは月曜だけ不可である。"]},
{cat:"Scheduling",q:"The audit must occur no later than Thursday.",a:"監査は木曜日までに行われなければならない。",w:["監査は木曜日より後にしか行えない。","監査は木曜日ちょうどに限る。","監査は木曜日より前には行えない。"]},
{cat:"Scheduling",q:"The training session is held every other day.",a:"研修は1日おきに行われる。",w:["研修は毎日行われる。","研修は2日連続で行われる。","研修は週に1回だけ行われる。"]},
{cat:"Assignment / Matching",q:"Each person is assigned exactly one task.",a:"各人にはちょうど1つの仕事が割り当てられる。",w:["各人には少なくとも2つの仕事が割り当てられる。","一つの仕事を全員で担当する。","誰にも仕事が割り当てられない場合がある。"]},
{cat:"Assignment / Matching",q:"No two players are assigned the same role.",a:"2人の選手が同じ役割を担当することはない。",w:["全員が同じ役割を担当する。","少なくとも2人は同じ役割を担当する。","同じ人が2つの役割を担当する。"]},
{cat:"Assignment / Matching",q:"Ben is assigned either the blue room or the green room.",a:"ベンは青の部屋か緑の部屋のどちらかに割り当てられる。",w:["ベンは青と緑の両方の部屋に割り当てられる。","ベンは青にも緑にも割り当てられない。","ベンは必ず青の部屋に割り当てられる。"]},
{cat:"Truth-teller / Liar",q:"Exactly one of Alice and Bob is telling the truth.",a:"アリスとボブのうち、正直者はちょうど1人である。",w:["アリスとボブは両方とも正直者である。","アリスとボブは両方とも嘘つきである。","少なくとも1人は正直者だが2人とも正直でもよい。"]},
{cat:"Truth-teller / Liar",q:"At least one of Carol and David is lying.",a:"キャロルとデイビッドの少なくとも1人は嘘をついている。",w:["キャロルとデイビッドは2人とも必ず嘘つきである。","キャロルとデイビッドは2人とも必ず正直者である。","キャロルとデイビッドのうち嘘つきは必ず1人だけである。"]},
{cat:"Truth-teller / Liar",q:"Neither Emma nor Frank is telling the truth.",a:"エマもフランクも正直者ではない。",w:["エマとフランクのうち1人だけ正直者である。","エマもフランクも正直者である。","少なくとも1人は正直者である。"]},
{cat:"Conditional deduction",q:"If Alice is selected, Bob must also be selected.",a:"アリスが選ばれるなら、ボブも選ばれなければならない。",w:["ボブが選ばれるなら、アリスも選ばれなければならない。","アリスとボブは必ず両方選ばれる。","アリスとボブは同時には選ばれない。"]},
{cat:"Conditional deduction",q:"Alice is selected only if Bob is selected.",a:"アリスが選ばれるためにはボブが選ばれている必要がある。つまり A → B。",w:["ボブが選ばれるなら必ずアリスも選ばれる。つまり B → A。","アリスとボブは必ず両方選ばれる。","アリスかボブのどちらか一方だけが選ばれる。"]},
{cat:"Conditional deduction",q:"Alice is selected if Bob is selected.",a:"ボブが選ばれるなら、アリスも選ばれる。つまり B → A。",w:["アリスが選ばれるなら、ボブも選ばれる。つまり A → B。","アリスとボブは必ず両方選ばれる。","アリスとボブは同時には選ばれない。"]},
{cat:"Conditional deduction",q:"Alice is selected if and only if Bob is selected.",a:"アリスが選ばれることとボブが選ばれることは同値である。A ⇔ B。",w:["アリスが選ばれるならボブは選ばれない。","ボブが選ばれるときだけアリスは選ばれない。","アリスとボブのうち必ず1人だけが選ばれる。"]},
{cat:"Conditional deduction",q:"Unless Carol is selected, David must be selected.",a:"キャロルが選ばれないなら、デイビッドが選ばれなければならない。",w:["キャロルが選ばれるなら、デイビッドも必ず選ばれる。","キャロルとデイビッドは両方とも選ばれない。","デイビッドが選ばれないなら、キャロルも選ばれない。"]},
{cat:"Conditional deduction",q:"Whenever Emma is assigned to Team A, Frank is assigned to Team B.",a:"エマがAチームに入るときはいつでも、フランクはBチームに入る。",w:["フランクがBチームなら必ずエマはAチームである。","エマとフランクは同じチームである。","エマは必ずAチームである。"]},
{cat:"Selection / Grouping",q:"Exactly three of the five players must be selected.",a:"5人のうち、ちょうど3人を選ばなければならない。",w:["5人のうち少なくとも3人を選ぶ。","5人のうち最大3人まで選ぶ。","5人全員を選ぶ。"]},
{cat:"Selection / Grouping",q:"At least two members of Team A must be women.",a:"Aチームには少なくとも2人の女性が必要である。",w:["Aチームの女性はちょうど2人でなければならない。","Aチームの女性は最大2人までである。","Aチームには女性を入れてはいけない。"]},
{cat:"Selection / Grouping",q:"At most one of George and Hannah may be selected.",a:"ジョージとハンナのうち、選ばれるのは最大1人までである。",w:["ジョージとハンナのうち必ず1人だけが選ばれる。","ジョージとハンナは2人とも選ばれなければならない。","ジョージとハンナは2人とも選ばれてはいけない。"]},
{cat:"Selection / Grouping",q:"Either Ian or Julia must be selected, but not both.",a:"イアンかジュリアのどちらか一方だけを選ばなければならない。",w:["イアンとジュリアの少なくとも1人を選べば、2人とも選んでもよい。","イアンとジュリアは2人とも選ばなければならない。","イアンもジュリアも選んではいけない。"]},
{cat:"Selection / Grouping",q:"Kevin and Laura must either both be selected or both be left out.",a:"ケビンとローラは2人とも選ばれるか、2人とも選ばれないかのどちらかである。",w:["ケビンとローラのうち必ず1人だけ選ばれる。","ケビンが選ばれるならローラは選ばれない。","ケビンとローラは必ず2人とも選ばれる。"]},
{cat:"Selection / Grouping",q:"Mia and Noah cannot be on the same team.",a:"ミアとノアは同じチームに所属できない。",w:["ミアとノアは必ず同じチームである。","ミアとノアは必ず隣り合う。","ミアとノアは同じ役割を担当する。"]},
{cat:"Selection / Grouping",q:"Olivia must be on the same team as Peter.",a:"オリビアはピーターと同じチームに所属しなければならない。",w:["オリビアとピーターは別チームでなければならない。","オリビアはピーターの後に選ばれなければならない。","オリビアはピーターと同じ役割を担当する。"]},
{cat:"Mixed / Quantifier",q:"No more than two of the four events may occur on Tuesday.",a:"4つのイベントのうち、火曜日に行えるのは最大2つまでである。",w:["4つのイベントのうち、火曜日に行うのはちょうど2つである。","4つのイベントのうち、火曜日に少なくとも2つ行う。","火曜日にはイベントを行えない。"]},
{cat:"Mixed / Quantifier",q:"At least one, but no more than three, must be selected.",a:"少なくとも1人、かつ最大3人まで選ばなければならない。",w:["ちょうど3人を選ばなければならない。","1人だけ選ばなければならない。","4人以上選ばなければならない。"]},
{cat:"Mixed / Quantifier",q:"All but one of the players finished before Zoe.",a:"ゾーイより前にゴールしたのは、ゾーイを除く選手のうち1人を除いた全員である。",w:["ゾーイより前にゴールしたのは1人だけである。","全員がゾーイより前にゴールした。","ゾーイは必ず1位である。"]},
{cat:"Mixed / Quantifier",q:"Exactly one person sits between Ryan and Sofia.",a:"ライアンとソフィアの間にはちょうど1人座っている。",w:["ライアンとソフィアは隣り合っている。","ライアンとソフィアの間には2人いる。","ライアンはソフィアの1席右である。"]},
{cat:"Mixed / Quantifier",q:"Tom is not necessarily selected even if Uma is selected.",a:"ウマが選ばれても、トムが必ず選ばれるとは限らない。",w:["ウマが選ばれたらトムも必ず選ばれる。","トムが選ばれたらウマも必ず選ばれる。","トムとウマは同時には選ばれない。"]},
{cat:"Mixed / Quantifier",q:"Victor is selected unless Wendy is selected.",a:"ウェンディが選ばれない限り、ビクターが選ばれる。",w:["ウェンディが選ばれたらビクターも必ず選ばれる。","ビクターが選ばれたらウェンディは選ばれない。","ビクターとウェンディは必ず両方選ばれる。"]}
];
const startScreen=document.getElementById('startScreen'),quizScreen=document.getElementById('quizScreen'),resultScreen=document.getElementById('resultScreen'),clueEl=document.getElementById('clue'),clueCard=document.getElementById('clueCard'),phaseHint=document.getElementById('phaseHint'),optionsEl=document.getElementById('options'),qNumEl=document.getElementById('qNum'),catEl=document.getElementById('category'),timerEl=document.getElementById('timer'),barEl=document.getElementById('bar');
let questions=[],index=0,score=0,questionStartedAt=0,choicesShownAt=0,currentReadingTime=0,completedActiveTime=0,raf=null,results=[],locked=false;
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startGame(){cancelAnimationFrame(raf);questions=shuffle(BANK).slice(0,10);index=0;score=0;results=[];locked=false;completedActiveTime=0;startScreen.classList.add('hidden');resultScreen.classList.add('hidden');quizScreen.classList.remove('hidden');renderQuestion();updateTimer()}
function updateTimer(){const current=locked?0:(performance.now()-questionStartedAt)/1000;timerEl.textContent=(completedActiveTime+current).toFixed(1)+' s';raf=requestAnimationFrame(updateTimer)}
function renderQuestion(){locked=false;questionStartedAt=performance.now();choicesShownAt=0;currentReadingTime=0;const item=questions[index];qNumEl.textContent=`Q${index+1} / 10`;catEl.textContent=item.cat;barEl.style.width=`${index*10}%`;clueEl.textContent=item.q;phaseHint.textContent='意味を理解したらタップ';clueCard.classList.remove('revealed');clueCard.disabled=false;optionsEl.classList.add('hidden');optionsEl.innerHTML='';shuffle([item.a,...item.w]).forEach(text=>{const btn=document.createElement('button');btn.className='option';btn.textContent=text;btn.addEventListener('click',()=>answer(btn,text,item));optionsEl.appendChild(btn)})}
function revealOptions(){if(locked||choicesShownAt)return;choicesShownAt=performance.now();currentReadingTime=(choicesShownAt-questionStartedAt)/1000;clueCard.classList.add('revealed');clueCard.disabled=true;phaseHint.textContent='正しい意味を選択';optionsEl.classList.remove('hidden')}
function answer(btn,selected,item){if(locked||!choicesShownAt)return;const answeredAt=performance.now(),answerTime=(answeredAt-choicesShownAt)/1000,elapsed=currentReadingTime+answerTime;locked=true;completedActiveTime+=elapsed;const correct=selected===item.a;if(correct)score++;[...optionsEl.children].forEach(b=>{b.disabled=true;if(b.textContent===item.a)b.classList.add('correct')});if(!correct)btn.classList.add('wrong');results.push({q:item.q,cat:item.cat,correctAnswer:item.a,correct,readingTime:currentReadingTime,answerTime,time:elapsed});setTimeout(()=>{index++;index<10?renderQuestion():finishGame()},correct?300:650)}
function finishGame(){cancelAnimationFrame(raf);barEl.style.width='100%';quizScreen.classList.add('hidden');resultScreen.classList.remove('hidden');const total=completedActiveTime,avgReading=results.reduce((s,r)=>s+r.readingTime,0)/results.length,avgAnswer=results.reduce((s,r)=>s+r.answerTime,0)/results.length;document.getElementById('score').textContent=`${score} / 10`;document.getElementById('totalTime').textContent=`${total.toFixed(1)} s`;document.getElementById('avgReading').textContent=`${avgReading.toFixed(1)} s`;document.getElementById('avgAnswer').textContent=`${avgAnswer.toFixed(1)} s`;const review=document.getElementById('review');review.innerHTML='';results.forEach((r,i)=>{const d=document.createElement('div');d.className='reviewitem';d.innerHTML=`<div class="small muted">${i+1}. ${escapeHtml(r.cat)} — Read ${r.readingTime.toFixed(1)}s / Answer ${r.answerTime.toFixed(1)}s</div><div class="en">${escapeHtml(r.q)}</div><div class="${r.correct?'ok':'ng'}">${r.correct?'✓ 正解':'✗ 不正解'}</div>${r.correct?'':`<div class="small muted" style="margin-top:6px">正解：${escapeHtml(r.correctAnswer)}</div>`}`;review.appendChild(d)});resultScreen.dataset.total=total.toFixed(1)}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function copyResult(){const total=resultScreen.dataset.total,mistakes=results.filter(r=>!r.correct).map(r=>r.q),avgReading=results.reduce((s,r)=>s+r.readingTime,0)/results.length,avgAnswer=results.reduce((s,r)=>s+r.answerTime,0)/results.length;let text=`English Clue Sprint\nScore: ${score}/10\nTotal: ${total}s\nAvg reading: ${avgReading.toFixed(1)}s\nAvg answer: ${avgAnswer.toFixed(1)}s`;if(mistakes.length)text+='\nMistakes:\n- '+mistakes.join('\n- ');try{await navigator.clipboard.writeText(text);const b=document.getElementById('copyBtn'),old=b.textContent;b.textContent='コピーしました';setTimeout(()=>b.textContent=old,1200)}catch(e){alert(text)}}
document.getElementById('startBtn').addEventListener('click',startGame);clueCard.addEventListener('click',revealOptions);document.getElementById('retryBtn').addEventListener('click',startGame);document.getElementById('copyBtn').addEventListener('click',copyResult);
</script></body></html>
